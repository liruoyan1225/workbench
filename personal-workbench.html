<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>综合工作台 · Personal Workbench</title>
<style>
  :root{
    --bg1:#FFF6EF; --bg2:#FCEBDD; --card:#FFFFFF; --card2:#FFF2E8;
    --orange:#F2793E; --orange-deep:#DD5A22; --orange-soft:#FBE2D2;
    --text:#43352E; --muted:#9C867A; --line:#F0DCCB;
    --mint:#34B07A; --lav:#7A6BC9; --sky:#3E8AC9; --peach:#F0805A; --lemon:#D99B33;
    --shadow:0 14px 34px rgba(221,90,34,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh;}
  /* ===== Sidebar ===== */
  .sidebar{
    width:256px;flex:0 0 256px;background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:26px 18px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;}
  .brand .logo{
    width:46px;height:46px;border-radius:13px;
    background:linear-gradient(135deg,var(--orange),var(--orange-deep));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;
    box-shadow:0 6px 16px rgba(221,90,34,.40);overflow:hidden;
  }
  .brand .logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:13px;}
  .brand .txt b{font-size:17px;display:block;letter-spacing:.5px;}
  .brand .txt span{font-size:11px;color:var(--muted);}
  .nav{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
  .nav button{
    display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;
    padding:17px 20px;border-radius:16px;cursor:pointer;color:var(--text);font-size:16px;
    text-align:left;transition:.18s;font-family:inherit;
  }
  .nav button svg{width:22px;height:22px;flex:0 0 22px;}
  .nav button:hover{background:var(--orange-soft);}
  .nav button.active{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;box-shadow:0 8px 20px rgba(221,90,34,.38);}
  .nav button.active svg{stroke:#fff;}
  .nav .dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-left:auto;}
  .sidebar .spacer{flex:1;}
  .side-actions{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px;}
  .side-actions button{
    border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:15px 16px;cursor:pointer;
    font-size:14.5px;color:var(--text);font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .side-actions button:hover{border-color:var(--orange);color:var(--orange);}
  .safe-note{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.5;margin-top:12px;}
  /* ===== Main ===== */
  .main{flex:1;padding:32px 40px 64px;overflow-x:hidden;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:26px;margin:0 0 6px;}
  .topbar .date{color:var(--muted);font-size:13.5px;}
  .grid{display:grid;gap:20px;align-items:stretch;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);}
  .card h2{font-size:17.5px;margin:0 0 16px;display:flex;align-items:center;gap:9px;}
  .card h2 .tag{font-size:11px;font-weight:600;color:var(--orange-deep);background:var(--orange-soft);padding:4px 11px;border-radius:20px;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  /* clock */
  .clock-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:170px;padding:18px 14px;}
  .clock-time{font-size:54px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.1;}
  .clock-date{margin-top:8px;color:var(--muted);font-size:14px;letter-spacing:1px;}
  .fest-block{width:100%;margin-top:16px;}
  .fest-title{font-size:11.5px;color:var(--muted);letter-spacing:2px;margin-bottom:8px;text-align:center;}
  .fest-grid{display:flex;gap:10px;flex-wrap:wrap;width:100%;}
  .fest-pill{flex:1 1 130px;min-width:0;background:var(--orange-soft);border:1px solid transparent;border-radius:14px;padding:11px 14px;display:flex;flex-direction:column;gap:3px;}
  .fest-pill .nm{font-size:13px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fest-pill .fd{font-size:19px;font-weight:800;color:var(--orange-deep);line-height:1.1;}
  .fest-pill .fd small{font-size:12px;font-weight:600;margin-left:2px;}
  /* note */
  .note-card{display:flex;flex-direction:column;}
  .note-card h2{flex:0 0 auto;}
  textarea.note{width:100%;flex:1;min-height:160px;border:1px solid var(--line);border-radius:15px;padding:16px;font-family:inherit;font-size:14.5px;resize:vertical;color:var(--text);background:var(--card2);}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .saved-tip{font-size:11px;color:var(--mint);margin-top:10px;height:14px;}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-grid .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0;}
  .cal-cell{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14.5px;position:relative;background:var(--card2);border:1px solid var(--line);}
  .cal-cell .ld{font-size:9.5px;color:var(--muted);margin-top:1px;transform:scale(.92);}
  .cal-cell.today{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;box-shadow:0 6px 16px rgba(221,90,34,.4);}
  .cal-cell.today .ld{color:#fff8f2;}
  .cal-cell.fest .ld{color:var(--orange-deep);font-weight:700;}
  /* events */
  .ev-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:10px;}
  .ev-item .d{font-size:12.5px;color:var(--orange-deep);font-weight:700;min-width:64px;}
  .ev-item .t{flex:1;font-size:15px;}
  .ev-item.done .t{text-decoration:line-through;color:var(--muted);}
  .ev-item .x{cursor:pointer;color:var(--muted);border:0;background:none;font-size:18px;width:28px;height:28px;border-radius:8px;transition:.15s;}
  .ev-item .x:hover{color:var(--orange-deep);background:var(--orange-soft);}
  /* summary */
  .sum-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;margin-bottom:10px;background:var(--card2);border:1px solid var(--line);}
  .sum-item .mod{font-size:11px;font-weight:700;padding:3px 10px;border-radius:9px;color:#fff;flex:0 0 auto;}
  .sum-item .nm{flex:1;font-size:14px;}
  .sum-item .st{font-size:11.5px;color:var(--muted);}
  .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:20px 0;}
  /* lists / module */
  .toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .btn{border:0;background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;padding:16px 30px;border-radius:15px;cursor:pointer;font-size:16px;font-family:inherit;font-weight:700;box-shadow:0 6px 18px rgba(221,90,34,.30);transition:.15s;}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--orange);color:var(--orange-deep);}
  .btn.sm{padding:13px 22px;font-size:14px;box-shadow:0 4px 12px rgba(221,90,34,.22);}
  input.in,select.in{border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:15px;font-family:inherit;color:var(--text);background:var(--card2);}
  input.in{flex:1;min-width:180px;}
  .chip{font-size:13.5px;padding:10px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card2);cursor:pointer;color:var(--muted);transition:.15s;}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--orange-soft);color:var(--orange-deep);border-color:var(--orange);font-weight:700;}
  .list{display:grid;gap:14px;}
  .item{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:20px 22px;transition:.15s;}
  .item:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .item .top{display:flex;align-items:flex-start;gap:12px;}
  .item .title{font-size:16.5px;font-weight:700;flex:1;line-height:1.4;}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:5px;}
  .badge{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;}
  .item .body{margin-top:12px;font-size:13.5px;color:#8a7568;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .item .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .tag-pill{display:inline-block;font-size:11px;background:#F0E8FC;color:#6B5BB0;padding:3px 10px;border-radius:20px;margin:3px 5px 3px 0;}
  .tl{margin-top:12px;border-left:2px solid var(--orange);padding-left:16px;}
  .tl .ev{position:relative;font-size:13px;padding:5px 0;color:#8a7568;}
  .tl .ev:before{content:"";position:absolute;left:-21px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--orange);}
  .tl .ev .td{color:var(--orange-deep);font-weight:700;margin-right:8px;}
  .kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;align-items:start;}
  .col{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;}
  .col h3{font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .col h3 .n{margin-left:auto;color:var(--muted);font-size:11px;}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(67,53,46,.28);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.hidden{display:none;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;width:min(600px,100%);max-height:88vh;overflow:auto;box-shadow:0 28px 70px rgba(67,53,46,.18);}
  .modal h3{margin:0 0 20px;font-size:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:600;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px;font-family:inherit;color:var(--text);background:var(--card2);}
  .field textarea{min-height:90px;resize:vertical;}
  .field .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .modal .foot{display:flex;gap:12px;justify-content:flex-end;margin-top:10px;}
  .hidden{display:none!important;}
  .sec-title{font-size:13px;font-weight:700;color:var(--orange-deep);margin:20px 0 10px;}
  /* timer panel (workbench) */
  .timer-card{background:linear-gradient(135deg,var(--orange-soft),#fff);border:1px solid var(--line);}
  .timer-top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .timer-left{display:flex;flex-direction:column;}
  .timer-label{font-size:12px;letter-spacing:2px;color:var(--orange-deep);font-weight:700;}
  .timer-display{font-size:52px;font-weight:800;letter-spacing:3px;font-variant-numeric:tabular-nums;color:var(--orange-deep);line-height:1.05;}
  .timer-meta{color:var(--muted);font-size:13.5px;flex:1;min-width:200px;}
  .timer-meta b{color:var(--text);}
  .timer-meta .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--orange-deep);margin-right:7px;vertical-align:middle;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}100%{opacity:1;transform:scale(1);}}
  .timer-ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;}
  @media(max-width:720px){.sidebar{display:none;}.main{padding:18px;}.clock-time{font-size:42px;}.timer-display{font-size:38px;}}
</style>
</head>

<script>
/* 历法算法已移除（用户要求去掉农历/节气/时辰） */

/* ===== App state ===== */
var KEY='personal_workbench_v1';
var S=load();
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r);
      if(d.literature&&!d.ideas)d.ideas=d.literature;
      if(d.papers&&!d.tasks)d.tasks=d.papers;
      if(!d.ideas)d.ideas=[];if(!d.sims)d.sims=[];if(!d.tasks)d.tasks=[];if(!d.events)d.events=[];
      if(typeof d.benchFree!=='number')d.benchFree=0;
      d.bench=(d.bench||[]).map(function(b){return Object.assign({tag:'论文',desc:'',goal:'',tracked:0,added:'',doneDate:null},b);});
      return d;
    }
  }catch(e){}
  return {note:'',events:[],ideas:[],sims:[],tasks:[],bench:[]};
}
function save(){S.benchFree=benchFreeTracked;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

var navItems=[
  {id:'home',name:'首页全景',icon:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'},
  {id:'idea',name:'课题idea',icon:'<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3Z"/>'},
  {id:'sim',name:'仿真实验',icon:'<path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8"/>'},
  {id:'task',name:'任务管理',icon:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9l2 2 4-4"/><path d="M8 15h6"/>'},
  {id:'bench',name:'工作台',icon:'<rect x="3" y="4" width="18" height="6" rx="1"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8"/>'}
];
var cur='home';

/* status palette */
var IDEA_TYPE=['想法','公众号','论文'];
var IDEA_COLOR={'想法':'var(--orange)','公众号':'var(--sky)','论文':'var(--lav)'};
var SIM_ST=['计划','进行中','完成','搁置'];
var SIM_COLOR={'计划':'var(--lav)','进行中':'var(--orange)','完成':'var(--mint)','搁置':'#d9c9bf'};
var TASK_ST=['待办','正在进行','加急处理','已解决'];
var TASK_COLOR={'待办':'var(--sky)','正在进行':'var(--orange)','加急处理':'#e08a8a','已解决':'var(--mint)'};
var BENCH_ST=['悬赏中','攻坚中','干掉了'];
var BENCH_COLOR={'悬赏中':'#e08a8a','攻坚中':'var(--orange)','干掉了':'var(--mint)'};

/* ===== render shell ===== */
function buildNav(){
  var h='';
  navItems.forEach(function(n){
    var badge='';
    if(n.id==='home'){}
    h+='<button class="'+(cur===n.id?'active':'')+'" onclick="go(\''+n.id+'\')">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+n.icon+'</svg>'
      +'<span>'+n.name+'</span></button>';
  });
  document.getElementById('nav').innerHTML=h;
}
function go(id){if(cur==='bench'&&benchRunning)benchStop(true);cur=id;buildNav();renderView();}
function renderView(){
  var v=document.getElementById('view');
  if(cur==='home')v.innerHTML=viewHome();
  else if(cur==='idea')v.innerHTML=viewIdea();
  else if(cur==='sim')v.innerHTML=viewSim();
  else if(cur==='task')v.innerHTML=viewTask();
  else if(cur==='bench')v.innerHTML=viewBench();
  if(cur==='bench')benchTimerRender();
  if(cur==='home')startClock();
}
function badge(text,color){return '<span class="badge" style="background:'+color+';color:#fff">'+esc(text)+'</span>';}

/* ===== HOME ===== */
var clockTimer=null;
function viewHome(){
  var today=new Date();
  return ''
  +'<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">'
    +'<div class="card clock-wrap" id="clockCard"></div>'
    +'<div class="card note-card"><h2>便利贴 <span class="tag">随手记</span></h2>'
      +'<textarea class="note" id="noteBox" oninput="onNote()" placeholder="今天最要紧的一件事…">'+esc(S.note)+'</textarea>'
      +'<div class="saved-tip" id="savedTip"></div></div>'
  +'</div>'
  +'<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;margin-top:20px">'
    +'<div class="card"><h2>本月日历 <span class="tag">'+today.getFullYear()+'年'+(today.getMonth()+1)+'月</span></h2><div id="calBox"></div></div>'
    +'<div class="card"><h2>近期行程 <span class="tag">未来30天</span></h2>'
      +'<div class="toolbar"><input class="in" id="evDate" type="date"><input class="in" id="evTitle" placeholder="安排内容…"><button class="btn sm" onclick="addEvent()">添加</button></div>'
      +'<div id="evBox"></div></div>'
  +'</div>'
  +'<div class="card" style="margin-top:20px"><h2>跨模块待办汇总 <span class="tag">未完成</span></h2><div id="sumBox"></div></div>';
}
function startClock(){
  renderClock();if(clockTimer)clearInterval(clockTimer);clockTimer=setInterval(renderClock,1000);
  renderCal();renderEvents();renderSummary();
}
function renderClock(){
  var now=new Date();
  var fests=getUpcomingHolidays(now).slice(0,3);
  var festHtml=fests.length
    ? '<div class="fest-block"><div class="fest-title">节日倒计时</div><div class="fest-grid">'+fests.map(function(f){
        var diff=Math.round((f.date-now)/86400000);
        return '<div class="fest-pill"><span class="nm">'+esc(f.name)+'</span><span class="fd">'+(diff<=0?'今天':diff)+'<small>天</small></span></div>';
      }).join('')+'</div></div>'
    : '';
  document.getElementById('clockCard').innerHTML=''
    +'<div class="clock-time" id="ct"></div>'
    +'<div class="clock-date">'+now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+['周日','周一','周二','周三','周四','周五','周六'][now.getDay()]+'</div>'
    +festHtml;
  var c=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  var hh=Math.floor(c/3600),mm=Math.floor((c%3600)/60),ss=c%60;
  var ct=document.getElementById('ct');if(ct)ct.textContent=pad(hh)+':'+pad(mm)+':'+pad(ss);
}
function getUpcomingHolidays(today){
  var list=[];var y=today.getFullYear();
  function add(name,date){if(date)list.push({name:name,date:date,t:date>=today});}
  add('元旦',new Date(y,0,1));add('情人节',new Date(y,1,14));add('劳动节',new Date(y,4,1));
  add('儿童节',new Date(y,5,1));add('国庆节',new Date(y,9,1));add('圣诞节',new Date(y,11,25));
  add('元旦',new Date(y+1,0,1));
  return list.filter(function(h){return h.t;}).sort(function(a,b){return a.date-b.date;});
}
function renderCal(){
  var today=new Date();var y=today.getFullYear(),m=today.getMonth();
  var first=new Date(y,m,1).getDay();var days=new Date(y,m+1,0).getDate();
  var html='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(function(w){html+='<div class="wd">'+w+'</div>';});
  for(var i=0;i<first;i++)html+='<div></div>';
  var fests={};
  getUpcomingHolidays(today).forEach(function(f){if(f.date.getMonth()===m)fests[ymd(f.date)]=f.name;});
  for(var d=1;d<=days;d++){
    var isT=(d===today.getDate());
    var key=ymd(new Date(y,m,d));
    var fest=fests[key];
    var cls='cal-cell'+(isT?' today':'')+(fest?' fest':'');
    html+='<div class="'+cls+'">'+d+(fest?'<div class="ld" style="color:var(--orange);font-weight:700">'+esc(fest)+'</div>':'')+'</div>';
  }
  html+='</div>';
  document.getElementById('calBox').innerHTML=html;
}

function renderSummary(){

}
function benchDoneCard(b){
  return '<div class="item" style="padding:16px 18px;margin-bottom:12px">'+benchCardTitle(b)
    +(b.doneDate?'<div class="meta">完成于 '+esc(b.doneDate)+'</div>':'')
    +'<div class="meta">计时 '+fmtSec(b.tracked||0)+'</div>'
    +'<div class="acts"><button class="btn ghost sm" onclick="benchRevive(\''+b.id+'\')">↺ 复活</button>'
    +'<button class="btn ghost sm" onclick="delBench(\''+b.id+'\')">删除</button></div></div>';
}
function benchAddPool(){
  var t=document.getElementById('bpTitle').value.trim();
  if(!t){alert('填写任务名称');return;}
  var tag=document.getElementById('bpTag').value;
  S.bench.push({id:uid(),title:t,tag:tag,desc:'',goal:'',status:'悬赏中',tracked:0,added:ymd(new Date()),doneDate:null});
  save();renderView();renderSummary();
}
function benchAddToday(){
  var t=document.getElementById('btTitle').value.trim();
  if(!t){alert('填写今日待办');return;}
  var g=document.getElementById('btGoal').value.trim();
  S.bench.push({id:uid(),title:t,tag:'杂项',desc:'',goal:g,status:'攻坚中',tracked:0,added:ymd(new Date()),doneDate:null});
  save();renderView();renderSummary();
}
function benchDispatch(id){var x=S.bench.find(function(z){return z.id===id;});if(x){benchStop(true);x.status='攻坚中';save();renderView();renderSummary();}}
function benchKill(id){benchStop(true);var x=S.bench.find(function(z){return z.id===id;});if(x){x.status='干掉了';x.doneDate=ymd(new Date());save();renderView();renderSummary();}}
function benchRevive(id){var x=S.bench.find(function(z){return z.id===id;});if(x){x.status='悬赏中';save();renderView();renderSummary();}}
function delBench(id){if(!confirm('删除这条？'))return;S.bench=S.bench.filter(function(z){return z.id!==id;});save();renderView();renderSummary();}
/* ===== 计时（顶部常驻计时器：可绑定今日追杀令任务，也可自由计时） ===== */
var benchRunning=null,benchTickInt=null,benchFreeTracked=S.benchFree||0;
function fmtSec(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return (h>0?h+':':'')+pad(m)+':'+pad(x);}
function benchElapsed(){return benchRunning?Math.round((Date.now()-benchRunning.start)/1000):0;}
function benchBase(id){return id==='free'?benchFreeTracked:((S.bench.find(function(z){return z.id===id;})||{}).tracked||0);}
function tmStart(){
  if(!document.getElementById('tmTask'))return;
  var target=document.getElementById('tmTask').value||'free';
  if(benchRunning){ if(benchRunning.id===target)return; benchStop(true); }
  benchRunning={id:target,start:Date.now()};
  if(!benchTickInt)benchTickInt=setInterval(benchTickUpdate,1000);
  benchTimerRender();
}
function tmPause(){
  if(!benchRunning)return;
  var el=benchElapsed();
  if(benchRunning.id==='free')benchFreeTracked+=el;
  else{var t=S.bench.find(function(z){return z.id===benchRunning.id;});if(t)t.tracked=(t.tracked||0)+el;}
  benchRunning=null;
  if(benchTickInt){clearInterval(benchTickInt);benchTickInt=null;}
  save();benchTimerRender();
}
function tmSaveSeg(){
  if(!benchRunning)return;
  var el=benchElapsed();
  if(benchRunning.id==='free')benchFreeTracked+=el;
  else{var t=S.bench.find(function(z){return z.id===benchRunning.id;});if(t)t.tracked=(t.tracked||0)+el;}
  benchRunning.start=Date.now();
  save();benchTimerRender();
}
function benchStop(silent){
  if(!benchRunning)return;
  var el=benchElapsed();
  if(benchRunning.id==='free')benchFreeTracked+=el;
  else{var t=S.bench.find(function(z){return z.id===benchRunning.id;});if(t)t.tracked=(t.tracked||0)+el;}
  benchRunning=null;
  if(benchTickInt){clearInterval(benchTickInt);benchTickInt=null;}
  save();
  if(!silent)benchTimerRender();
}
function benchTickUpdate(){
  if(!benchRunning)return;
  var total=benchBase(benchRunning.id)+benchElapsed();
  var d=document.getElementById('tmDisplay');if(d)d.textContent=fmtSec(total);
  if(benchRunning.id!=='free'){var el=document.getElementById('bm-'+benchRunning.id);if(el)el.textContent=fmtSec(total);}
}
function benchTimerRender(){
  var disp=document.getElementById('tmDisplay');if(!disp)return;
  var meta=document.getElementById('tmMeta');
  var startBtn=document.getElementById('tmStart');
  var stopBtn=document.getElementById('tmStop');
  var saveBtn=document.getElementById('tmSave');
  if(benchRunning){
    var id=benchRunning.id;
    var sel=document.getElementById('tmTask');if(sel)sel.value=id;
    disp.textContent=fmtSec(benchBase(id)+benchElapsed());
    var name=id==='free'?'自由计时':((S.bench.find(function(z){return z.id===id;})||{}).title||'');
    meta.innerHTML='<span class="pulse"></span>正在计时 · <b>'+esc(name)+'</b> · 切到别的页面也会继续走';
    if(startBtn)startBtn.style.display='none';
    if(stopBtn)stopBtn.style.display='';
    if(saveBtn)saveBtn.style.display='';
  }else{
    var s2=document.getElementById('tmTask');
    var target=s2?(s2.value||'free'):'free';
    disp.textContent=fmtSec(benchBase(target));
    meta.innerHTML=(target&&target!=='free')?'已累计 · 点「开始」继续计时':'未开始 · 选一个「今日追杀令」任务，或自由计时';
    if(startBtn)startBtn.style.display='';
    if(stopBtn)stopBtn.style.display='none';
    if(saveBtn)saveBtn.style.display='none';
  }
}
function benchCardTimer(id){
  if(benchRunning&&benchRunning.id===id){tmPause();return;}
  var sel=document.getElementById('tmTask');if(sel)sel.value=id;
  tmStart();
}
function openBench(id){
  var x=id?S.bench.find(function(z){return z.id===id;}):null;
  var v=x||{title:'',tag:'论文',desc:'',goal:'',status:'悬赏中'};
  openModal('<h3>'+(id?'编辑任务':'新建任务')+'</h3>'
    +field('任务标题','f_title',v.title,'要攻克的事')
    +'<div class="row"><div class="field" style="flex:1">'+lab('标签')+'<select id="f_tag">'+BENCH_TAGS.map(function(t){return '<option'+(v.tag===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div>'
      +'<div class="field" style="flex:1">'+lab('状态')+'<select id="f_status">'+BENCH_ST.map(function(s){return '<option'+(v.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div></div>'
    +field('说明','f_desc',v.desc,'目标、关键难点、验收标准…')
    +field('攻坚目标（今日用）','f_goal',v.goal,'如：Method 改完 80%')
    +'<div class="foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveBench(\''+(id||'')+'\')">保存</button></div>');
}
function saveBench(id){
  var obj={title:val('f_title').trim(),tag:val('f_tag'),desc:val('f_desc').trim(),goal:val('f_goal').trim(),status:val('f_status')};
  if(!obj.title){alert('标题不能为空');return;}
  if(id){var x=S.bench.find(function(z){return z.id===id;});Object.assign(x,obj);}else{S.bench.push(Object.assign({id:uid(),tracked:0,added:ymd(new Date()),doneDate:null},obj));}
  save();closeModal();renderView();renderSummary();
}

/* ===== modal helpers ===== */
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden');}
function closeModal(){document.getElementById('overlay').classList.add('hidden');}
function field(label,id,value,ph){return '<div class="field">'+lab(label)+'<input id="'+id+'" value="'+esc(value||'')+'" placeholder="'+esc(ph||'')+'"></div>';}
function lab(t){return '<label>'+t+'</label>';}
function val(id){var e=document.getElementById(id);return e?e.value:'';}

/* ===== backup ===== */
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='workbench-backup-'+ymd(new Date())+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importData(){document.getElementById('fileInput').click();}
function handleImport(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(typeof d!=='object')throw 0;if(!confirm('导入将覆盖当前数据，确定继续？'))return;S=d;save();renderView();buildNav();alert('已恢复备份');}catch(err){alert('文件格式不正确');}};
  r.readAsText(f);e.target.value='';
}

/* ===== init ===== */
function init(){
  buildNav();
  var now=new Date();var h=now.getHours();
  var g=h<5?'夜深了':h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好';
  document.getElementById('greet').textContent=g+'，coco老大';
  document.getElementById('todayStr').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  document.getElementById('storeInfo').textContent='上次记录：'+ymd(now);
  renderView();
}
init();
</script>
</body>
